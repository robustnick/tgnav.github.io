<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width,height=device-height, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes"> 
    <meta name="robots" content="noindex,follow">
    <link rel="shortcut icon" href="/assets/images/favicon.png">
    <script src="../sw.js"></script>
    
    <title>加载中LOADING...</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/pace-js@latest/pace.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pace-js@latest/pace-theme-default.min.css" />
</head>
<body>
    <div class='center-box'>
        <div class='loader_overlay'></div>
        <div class='loader_cogs'>
            <div class='loader_cogs__top'>
                <div class='top_part'></div>
                <div class='top_part'></div>
                <div class='top_part'></div>
                <div class='top_hole'></div>
            </div>
            <div class='loader_cogs__left'>
                <div class='left_part'></div>
                <div class='left_part'></div>
                <div class='left_part'></div>
                <div class='left_hole'></div>
            </div>
            <div class='loader_cogs__bottom'>
                <div class='bottom_part'></div>
                <div class='bottom_part'></div>
                <div class='bottom_part'></div>
                <div class='bottom_hole'></div>
            </div>
        </div>
        <p class="loading-text">正在唤起Telegram客户端，请稍候<dot>...</dot></p>
    </div>
</body>

<script type="text/javascript">
window.onload = function() {
    const url = new URL(window.location.href);
    const params = new URLSearchParams(url.search);
    const username = params.get('username');
    
    // 自动获取你当前自己的域名，不再死板地写死
    var my_domain = window.location.host; 
    
    if (username) {
        document.title = "正在跳转至@" + username + "...";
        setTimeout(function() {
            window.location.href = "https://t.me/" + username;
        }, 1500); // 优化：将等待时间从3秒缩短到1.5秒，让你的网站跳转更快！
        
        setTimeout(function() {
            window.opener = null;
            window.close();
        }, 15000);
    } else {
        Swal.fire({ icon: "error", title: "错误", text: "链接参数错误，3秒后返回首页" });
        setTimeout(function() {
            // 出错时，自动返回到你自己的网站首页
            window.location.href = "https://" + my_domain; 
        }, 3000);
    }
    setTimeout(function() {
        window.opener = null;
        window.close();
    }, 30000);
}
</script>
</html>
